name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Smoke test (CLI help)
        run: |
          outline-only --help

                - name: Run conversion on sample
        run: |
          mkdir -p out
          outline-only examples/input.png -o out/outline.png

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: outline-output-${{ matrix.python-version }}
          path: out/outline.png
