name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Smoke test (CLI)
        run: |
          outline-only --help

      - name: Run sample conversion
        run: |
          mkdir -p out
          outline-only examples/input.png -o out/outline.png

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: outline-result
          path: out/outline.png
